<!doctype html>
<html lang="lb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Klassennotizen: Notizen per Sprooch oder Text pro Schüler, mat Export a Backup.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Klassennotizen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Klassennotizen</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f2f7; --surface: #ffffff; --surface-2: #f2f2f7; --sheet: #ffffff;
    --fill: rgba(120,120,128,.12); --fill-strong: rgba(120,120,128,.2);
    --label: #000000; --label-2: rgba(60,60,67,.72); --label-3: rgba(60,60,67,.3); --sep: rgba(60,60,67,.2);
    --tint: #0f766e; --tint-ink: #ffffff; --tint-soft: rgba(15,118,110,.12);
    --red: #ff3b30; --orange: #ff9500; --orange-text: #b25e00; --green: #34c759; --green-text: #1f7a3a;
    --bar: rgba(242,242,247,.74);
    --glass: rgba(255,255,255,.58); --glass-strong: rgba(255,255,255,.95);
    --glass-edge: rgba(255,255,255,.75); --glass-hi: rgba(255,255,255,.9);
    --glass-shadow: 0 10px 34px rgba(0,0,0,.14), 0 2px 8px rgba(0,0,0,.06);
    --scrim: rgba(0,0,0,.3); --ring: rgba(60,60,67,.55);
    --r-card: 24px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --sheet: #1c1c1e;
      --fill: rgba(120,120,128,.24); --fill-strong: rgba(120,120,128,.36);
      --label: #ffffff; --label-2: rgba(235,235,245,.68); --label-3: rgba(235,235,245,.3); --sep: rgba(84,84,88,.65);
      --tint: #3cc4b4; --tint-ink: #03201c; --tint-soft: rgba(60,196,180,.18);
      --red: #ff453a; --orange: #ff9f0a; --orange-text: #ff9f0a; --green: #30d158; --green-text: #30d158;
      --bar: rgba(0,0,0,.72);
      --glass: rgba(60,60,64,.52); --glass-strong: rgba(44,44,46,.95);
      --glass-edge: rgba(255,255,255,.16); --glass-hi: rgba(255,255,255,.1);
      --glass-shadow: 0 12px 38px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
      --scrim: rgba(0,0,0,.5); --ring: rgba(255,255,255,.88);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 17px; -webkit-text-size-adjust: 100%; }
  @supports (font: -apple-system-body) { html { font: -apple-system-body; } } /* iOS: folgt der eingestellten Textgröße */
  body {
    margin: 0; background: var(--bg); color: var(--label); font-size: 1rem; line-height: 1.3;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
  }
  body.sheet-open { overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:disabled { cursor: default; }
  input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--tint); outline-offset: 2px; }
  .hidden { display: none !important; }
  .ic { display: block; flex: none; }

  /* ---------- Navigation: schwebende Glas-Tasten + Titel, der beim Scrollen erscheint ---------- */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
    padding: calc(env(safe-area-inset-top) + 6px) 14px 6px; min-height: calc(env(safe-area-inset-top) + 56px);
    transition: background .2s, box-shadow .2s;
  }
  .nav.scrolled {
    background: var(--bar); -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
    box-shadow: 0 .5px 0 var(--sep);
  }
  .navstart { justify-self: start; } .navend { justify-self: end; display: flex; gap: 8px; }
  .navtitle { font-weight: 600; max-width: 52vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .15s; }
  .navtitle.show { opacity: 1; }
  .glassbtn {
    display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; color: var(--label);
    background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
    box-shadow: inset 0 0 0 .5px var(--glass-edge), inset 0 1px 0 var(--glass-hi), 0 4px 14px rgba(0,0,0,.1);
    transition: transform .15s;
  }
  .glassbtn:active { transform: scale(.92); }

  /* ---------- Seite ---------- */
  main { max-width: 680px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 56px) 16px calc(env(safe-area-inset-bottom) + 40px); }
  main.with-dock { padding-bottom: calc(env(safe-area-inset-bottom) + 190px); }
  .titleblock { padding: 6px 4px 16px; }
  .largetitle { margin: 0; font-size: 2rem; font-weight: 700; letter-spacing: -.025em; line-height: 1.15; overflow-wrap: anywhere; }
  .subtitle { margin: 3px 0 0; color: var(--label-2); }
  .sectionhead { margin: 24px 16px 8px; font-size: .88rem; font-weight: 400; color: var(--label-2); }
  .footnote { margin: -8px 16px 22px; font-size: .82rem; line-height: 1.4; color: var(--label-2); }

  /* ---------- Listen (inset grouped) ---------- */
  .list, .card { background: var(--surface); border-radius: var(--r-card); margin: 0 0 20px; overflow: hidden; }
  .cell { position: relative; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 16px; }
  .cell + .cell::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep); }
  .cell.tap { cursor: pointer; }
  .cell.tap:active { background: var(--fill); }
  .cell .stack { flex: 1; min-width: 0; }
  .cell .name { display: block; font-weight: 500; overflow-wrap: anywhere; }
  .cell .sub { display: block; margin-top: 1px; font-size: .88rem; color: var(--label-2); }
  .cell .detail { color: var(--label-2); }
  .cell .ic.chev { color: var(--label-3); }
  .cell.destructive .name { color: var(--red); }
  .glyph { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; }
  .glyph.tint { background: var(--tint); color: var(--tint-ink); } .glyph.green { background: #34a853; } .glyph.red { background: var(--red); } .glyph.gray { background: #8e8e93; }
  .glyph .ic { width: 19px; height: 19px; }
  .empty-row { padding: 18px 16px; color: var(--label-2); }
  .plain { width: 100%; background: none; border: 0; outline: none; padding: 0; min-height: 40px; }
  .plain::placeholder, textarea::placeholder { color: var(--label-3); }
  .card textarea { display: block; width: 100%; background: none; border: 0; outline: none; padding: 14px 16px; resize: vertical; min-height: 120px; line-height: 1.4; }
  .card .cell { min-height: 52px; }
  .minus { width: 30px; height: 30px; display: grid; place-items: center; color: var(--red); flex: none; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--fill); color: var(--label-2); border-radius: 999px; padding: 0 14px; min-height: 44px; margin: 0 0 16px; }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; }
  .search:focus-within { outline: 3px solid var(--tint); }

  /* ---------- Buttons ---------- */
  .capsule {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px;
    border-radius: 999px; font-weight: 600; background: var(--fill); color: var(--tint); transition: transform .12s, opacity .12s;
  }
  .capsule.filled { background: var(--tint); color: var(--tint-ink); }
  .capsule.soft { background: var(--tint-soft); color: var(--tint); }
  .capsule.block { display: flex; width: 100%; margin: 0 0 20px; }
  .capsule.sm { min-height: 38px; padding: 0 18px; font-size: .94rem; }
  .capsule:active { transform: scale(.97); opacity: .85; }
  .capsule:disabled { opacity: .4; transform: none; }
  .txtbtn { min-height: 44px; padding: 0 4px; font-size: 1rem; color: var(--tint); }
  .txtbtn.danger { color: var(--red); }

  /* ---------- Dock: schwebende Glasfläche unten ---------- */
  .dock {
    position: fixed; z-index: 20; left: 0; right: 0; margin: 0 auto; width: min(656px, calc(100% - 24px));
    bottom: calc(env(safe-area-inset-bottom) + 10px); border-radius: 34px; padding: 12px 16px 10px;
    background: var(--glass); -webkit-backdrop-filter: blur(28px) saturate(190%); backdrop-filter: blur(28px) saturate(190%);
    box-shadow: inset 0 0 0 .5px var(--glass-edge), inset 0 1px 0 var(--glass-hi), var(--glass-shadow);
  }
  .backupcard { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; border-radius: 30px; padding: 14px 14px 14px 18px; }
  .backuptext { display: flex; align-items: center; gap: 10px; flex: 1 1 190px; min-width: 0; }
  .backupcard .dot { flex: none; }
  .backupcard .state { font-weight: 600; font-size: .95rem; }
  .backupcard .sub { font-size: .82rem; color: var(--label-2); }
  .backupcard.dirty .state, .backupcard.dirty .dot { color: var(--orange-text); }
  .backupcard:not(.dirty) .state, .backupcard:not(.dirty) .dot { color: var(--green-text); }
  .backupcard .capsule { flex: 1 1 auto; }

  .wavewrap { height: 0; overflow: hidden; transition: height .34s cubic-bezier(.2,.9,.25,1); }
  .dock.recording .wavewrap { height: 84px; margin-bottom: 8px; }
  #wave { display: block; width: 100%; height: 84px; }
  .dockrow { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 72px; }
  .slot { display: flex; align-items: center; }
  .slot.r { justify-self: end; }
  .only-rec { display: none; } .dock.recording .only-rec { display: inline-grid; } .dock.recording .only-idle { display: none; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 1.3rem; letter-spacing: -.01em; min-width: 3.2rem; text-align: right; display: none; }
  .dock.recording .timer { display: block; }
  .timer.warn { color: var(--orange-text); }
  .recbtn { position: relative; width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; }
  .recbtn::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 4px solid var(--ring); transition: transform .2s; }
  .recbtn .rb { width: 58px; height: 58px; border-radius: 50%; background: var(--red); transition: width .26s cubic-bezier(.3,1.3,.5,1), height .26s cubic-bezier(.3,1.3,.5,1), border-radius .26s; }
  .recbtn.on .rb { width: 30px; height: 30px; border-radius: 9px; }
  .recbtn:active::before { transform: scale(.94); } .recbtn:disabled { opacity: .45; }
  .hint { text-align: center; font-size: .82rem; color: var(--label-2); margin-top: 4px; min-height: 1.2em; }
  .hint.ok { color: var(--green-text); } .hint.err { color: var(--red); }
  .dock.recording .hint { display: none; }

  /* ---------- Notizen ---------- */
  .note { position: relative; padding: 12px 16px 14px; }
  .note + .note::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep); }
  .notehead { display: flex; align-items: center; justify-content: space-between; min-height: 28px; }
  .notedate { font-size: .88rem; font-weight: 500; color: var(--label-2); }
  .more { width: 40px; height: 36px; margin: -4px -8px -4px 0; display: grid; place-items: center; color: var(--label-2); border-radius: 18px; }
  .more:active { background: var(--fill); }
  .note .text { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.4; }
  .tag { margin-left: 8px; font-size: .72rem; font-weight: 600; color: var(--orange-text); background: rgba(255,149,0,.16); border-radius: 999px; padding: 2px 9px; }
  .empty { text-align: center; padding: 28px 24px 0; color: var(--label-2); }
  .empty .art { width: 168px; height: 168px; color: var(--tint); }
  .empty h2 { margin: 6px 0 6px; font-size: 1.25rem; font-weight: 600; color: var(--label); letter-spacing: -.01em; }
  .empty p { margin: 0 auto; max-width: 30ch; line-height: 1.4; }

  /* ---------- Sheets ---------- */
  #editor, .overlay { position: fixed; inset: 0; z-index: 40; }
  #editor .scrim, .overlay .scrim { position: absolute; inset: 0; background: var(--scrim); animation: fadein .25s both; }
  #editor.closing .scrim { animation: fadeout .22s both; }
  .sheet {
    position: absolute; left: 0; right: 0; margin: 0 auto; width: min(640px, 100%); bottom: var(--kb, 0px);
    max-height: calc(var(--vvh, 100dvh) - env(safe-area-inset-top) - 14px); overflow: auto; overscroll-behavior: contain;
    background: var(--sheet); border-radius: 32px 32px 0 0; padding: 8px 18px calc(env(safe-area-inset-bottom) + 18px);
    box-shadow: 0 -10px 44px rgba(0,0,0,.2); animation: rise .4s cubic-bezier(.2,.9,.25,1) backwards;
  }
  #editor.closing .sheet { animation: drop .22s ease-in both; }
  .grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--label-3); margin: 0 auto 4px; }
  .sheet-nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 4px 0 10px; touch-action: none; }
  .sheet-nav h2 { margin: 0; font-size: 1.06rem; font-weight: 600; }
  .sheet-nav .txtbtn { justify-self: start; } .sheet-nav .capsule { justify-self: end; }
  .status { display: flex; align-items: center; gap: 8px; margin: 0 2px 10px; font-size: .92rem; color: var(--label-2); }
  .status.ok { color: var(--green-text); } .status.err { color: var(--red); }
  .sheet textarea { display: block; width: 100%; min-height: 150px; resize: none; border: 0; outline: none; background: var(--surface-2); border-radius: 22px; padding: 14px 16px; line-height: 1.4; }
  .sheet.busy textarea { opacity: .55; }
  .daterow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .daterow label { color: var(--label-2); font-size: .94rem; padding-right: 2px; }
  .datebox { position: relative; flex: 1 1 0; min-width: 0; }
  .datebox .datetext { display: flex; align-items: center; min-height: 44px; border-radius: 14px; padding: 0 12px; background: var(--surface-2); font-variant-numeric: tabular-nums; }
  .datebox input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; cursor: pointer; } /* echtes Datumsfeld bleibt für die Auswahl, angezeigt wird TT/MM/JJJJ */
  .chips { display: flex; gap: 8px; flex: 1 1 100%; }
  .chips .chip { flex: 1; }
  .chip { min-height: 44px; padding: 0 12px; border-radius: 999px; background: var(--fill); font-size: .86rem; font-weight: 500; white-space: nowrap; }
  .chip:active { background: var(--fill-strong); }
  #retry { margin-top: 12px; }
  .spinner { width: 16px; height: 16px; border: 2.5px solid var(--fill-strong); border-top-color: var(--label-2); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }

  .actionwrap { position: absolute; left: 0; right: 0; margin: 0 auto; width: min(420px, calc(100% - 16px)); bottom: calc(env(safe-area-inset-bottom) + 8px); display: flex; flex-direction: column; gap: 8px; animation: rise .36s cubic-bezier(.2,.9,.25,1) both; }
  .actiongroup, .actionbtn.cancel { background: var(--glass-strong); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%); border-radius: 26px; overflow: hidden; box-shadow: var(--glass-shadow); }
  .actiontitle { padding: 14px 16px 6px; text-align: center; font-size: .82rem; color: var(--label-2); }
  .actionbtn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 58px; color: var(--tint); font-size: 1.06rem; }
  .actiongroup .actionbtn + .actionbtn { border-top: .5px solid var(--sep); }
  .actionbtn.destructive { color: var(--red); } .actionbtn.cancel { font-weight: 600; }
  .actionbtn:active { background: var(--fill); }

  .toast {
    position: fixed; z-index: 70; left: 0; right: 0; margin: 0 auto; width: fit-content; max-width: calc(100% - 32px);
    top: calc(env(safe-area-inset-top) + 64px); padding: 11px 18px; border-radius: 999px; font-size: .94rem; font-weight: 500; text-align: center;
    background: var(--glass-strong); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
    box-shadow: inset 0 0 0 .5px var(--glass-edge), var(--glass-shadow);
    opacity: 0; transform: translateY(-8px) scale(.97); transition: opacity .2s, transform .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: none; }

  @keyframes rise { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes drop { to { transform: translateY(100%); } }
  @keyframes fadein { from { opacity: 0; } }
  @keyframes fadeout { to { opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  @media (prefers-reduced-transparency: reduce) {
    :root { --glass: var(--surface); --glass-strong: var(--surface); --bar: var(--bg); }
    .nav.scrolled, .glassbtn, .dock, .actiongroup, .actionbtn.cancel, .toast { -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
  @media (prefers-contrast: more) { :root { --sep: rgba(60,60,67,.5); --label-2: rgba(0,0,0,.85); } }
  @media (prefers-contrast: more) and (prefers-color-scheme: dark) { :root { --sep: rgba(255,255,255,.4); --label-2: rgba(255,255,255,.9); } }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    :root { --glass: var(--surface); --glass-strong: var(--surface); --bar: var(--bg); }
  }
</style>
</head>

<script>
"use strict";
/* ---------- Konfiguration ---------- */
const DEFAULT_API = "https://luxasr.uni.lu";
const API_KEY = "klassennotizen.api"; // optional: eigene Server-Adresse (Proxy), siehe Einstellungen
let API = DEFAULT_API;
try { const v = localStorage.getItem(API_KEY); if (/^https:\/\//.test(v || "")) API = v.replace(/\/+$/, ""); } catch (e) {}
const MAX_REC_SECONDS = 120;
const STORE_KEY = "sportnotizen.v1"; // Schlüssel bleibt wie in der alten App, damit vorhandene Daten erhalten bleiben
const HINT = "Tipp fir opzehuelen";
const APP_NAME = "Klassennotizen";
/* Luxemburgisch, wenn der Browser es kennt, sonst Deutsch (nur für Datum und Uhrzeit) */
const LOC = (() => { try { return Intl.DateTimeFormat.supportedLocalesOf(["lb-LU", "lb"])[0] || "de-LU"; } catch (e) { return "de-LU"; } })();

/* ---------- Symbole (Strichstärke und Rundung wie bei SF Symbols) ---------- */
const ic = (p, s = 22, w = 1.9) => `<svg class="ic" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I = {
  back: ic('<path d="M14.5 5.5 8 12l6.5 6.5"/>', 22, 2.3),
  chev: ic('<path d="M9.5 5.5 16 12l-6.5 6.5"/>', 14, 2.6),
  sliders: ic('<path d="M4 7h8.8M17.2 7H20M4 12h2.8M11.2 12H20M4 17h10.8M19.2 17H20"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="17" cy="17" r="2.2"/>'),
  keyboard: ic('<rect x="2.8" y="6" width="18.4" height="12" rx="3.4"/><path d="M7 10h.01M10.7 10h.01M14.4 10h.01M17.1 10h.01M8.6 14h6.8" stroke-width="2.2"/>', 26),
  x: ic('<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>', 20, 2.2),
  more: ic('<circle cx="5.5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.7" fill="currentColor" stroke="none"/>'),
  search: ic('<circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/>', 18, 2.1),
  note: ic('<rect x="5" y="3.5" width="14" height="17" rx="3.5"/><path d="M9 8.5h6M9 12h6M9 15.5h3.5"/>', 19),
  personPlus: ic('<circle cx="9.5" cy="8.5" r="3.5"/><path d="M3.5 19.5c.7-3.2 3-5 6-5s5.3 1.8 6 5"/><path d="M18.5 8v6M15.5 11h6"/>', 19),
  share: ic('<path d="M12 3.5v11M8 7l4-3.5L16 7"/><path d="M8.5 10.5H7a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1.5"/>', 19),
  backup: ic('<path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/>', 19),
  restore: ic('<path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 19.5h14"/>', 19),
  plus: ic('<path d="M12 5v14M5 12h14"/>', 19, 2.2),
  pencil: ic('<path d="M4.5 19.5l.9-4L16.2 4.7a2 2 0 0 1 2.8 0l.3.3a2 2 0 0 1 0 2.8L8.5 18.6z"/><path d="M14.5 6.5l3 3"/>', 20),
  trash: ic('<path d="M4.5 7h15M9.5 7V4.5h5V7M6.8 7l.8 12.5h8.8L17.2 7M10.3 11v5M13.7 11v5"/>', 20),
  minus: ic('<circle cx="12" cy="12" r="10" fill="currentColor" stroke="none"/><path d="M7.5 12h9" stroke="#fff" stroke-width="2.4"/>', 26),
  tick: ic('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 20, 2.4),
  check: ic('<circle cx="12" cy="12" r="10.5" fill="currentColor" stroke="none"/><path d="M7.3 12.4l3.2 3.2 6.2-6.6" stroke="#fff" stroke-width="2.3"/>', 26),
  warn: ic('<circle cx="12" cy="12" r="10.5" fill="currentColor" stroke="none"/><path d="M12 7v6.2M12 16.6h.01" stroke="#fff" stroke-width="2.5"/>', 26)
};

/* ---------- Daten ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
let db = load();
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY));
    if (d && Array.isArray(d.classes)) { d.classes.forEach(ensureGeneral); return d; }
  } catch (e) {}
  return { classes: [] };
}
function ensureGeneral(c) {
  if (!c.general) c.general = { id: "general", name: "Allgemeng", notes: [] };
  return c;
}
const GENERAL_LABEL = "Allgemeng (Klass)";
const classNoteCount = c => c.general.notes.length + c.students.reduce((a, s) => a + s.notes.length, 0);
/* Backup-Status (getrennt von den Daten): letzter Backup-Zeitpunkt und Änderungen seither */
const META_KEY = "sportnotizen.meta";
let meta = { lastBackup: 0, changes: 0, cloudAt: 0, cloudDirty: false, cloudErr: "" };
try { Object.assign(meta, JSON.parse(localStorage.getItem(META_KEY))); } catch (e) {}
function saveMeta() { try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch (e) {} }
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
  catch (e) { toast("Späicheren huet net geklappt!"); return; }
  meta.changes++; meta.cloudDirty = true; saveMeta(); scheduleCloud();
}
function relTime(ts) {
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return "grad elo";
  if (m < 60) return `viru ${m} Min.`;
  const h = Math.floor(m / 60);
  if (h < 24) return `viru ${h} Std.`;
  const d = Math.floor(h / 24);
  return d === 1 ? "gëschter" : `viru ${d} Deeg`;
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
const findClass = id => db.classes.find(c => c.id === id);
const findStudent = (c, id) => c && (id === "general" ? c.general : c.students.find(s => s.id === id));
const byName = (a, b) => a.name.localeCompare(b.name, "de", { sensitivity: "base" });

/* ---------- Hilfsfunktionen ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
/* Datum immer als TT/MM/JJJJ (unabhängig von der Browser-Sprache) */
const fmtDate = ts => { const d = new Date(ts); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };
const fmtDateVal = v => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ""); return m ? `${m[3]}/${m[2]}/${m[1]}` : ""; };
const pad = n => String(n).padStart(2, "0");
const toDateVal = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
function fromDateVal(val, timeFrom) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(val || ""); if (!m) return null;
  const t = new Date(timeFrom || Date.now());
  return new Date(+m[1], +m[2] - 1, +m[3], t.getHours(), t.getMinutes()).getTime();
}
const isFuture = ts => { const e = new Date(); e.setHours(23, 59, 59, 999); return ts > e.getTime(); };
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const titleHtml = (t, sub) => `<div class="titleblock"><h1 class="largetitle" id="largeTitle">${esc(t)}</h1>${sub ? `<p class="subtitle">${esc(sub)}</p>` : ""}</div>`;
const dateRowHtml = (id, ts) => `<div class="daterow"><label for="${id}">Datum</label>
  <div class="datebox"><span class="datetext" aria-hidden="true">${fmtDateVal(toDateVal(ts))}</span><input type="date" id="${id}" value="${toDateVal(ts)}" aria-label="Datum"></div>
  <div class="chips"><button type="button" class="chip" data-shift="-1">−1 Dag</button>
  <button type="button" class="chip" data-shift="7">+1 Woch</button></div></div>`;
function setDateVal(inp, val) { inp.value = val; const t = inp.parentNode.querySelector(".datetext"); if (t) t.textContent = fmtDateVal(inp.value); }
function bindDateRow(root, id) {
  const field = root.querySelector("#" + id);
  field.addEventListener("input", () => setDateVal(field, field.value));
  field.addEventListener("change", () => setDateVal(field, field.value));
  field.addEventListener("click", () => { try { field.showPicker && field.showPicker(); } catch (e) {} });
  root.querySelectorAll("[data-shift]").forEach(b => b.onclick = () => {
    const inp = root.querySelector("#" + id);
    const base = fromDateVal(inp.value) || Date.now();
    const d = new Date(base); d.setDate(d.getDate() + Number(b.dataset.shift));
    setDateVal(inp, toDateVal(d.getTime()));
  });
}
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
/* Tastatur und Seitengröße (iOS): Sheets bleiben über der Tastatur sichtbar */
if (window.visualViewport) {
  const upd = () => {
    const v = window.visualViewport, r = document.documentElement.style;
    r.setProperty("--kb", Math.max(0, window.innerHeight - v.height - v.offsetTop) + "px");
    r.setProperty("--vvh", v.height + "px");
  };
  visualViewport.addEventListener("resize", upd); visualViewport.addEventListener("scroll", upd); upd();
}

/* ---------- Kopfzeile ---------- */
const gearBtn = `<button id="menuBtn" class="glassbtn" aria-label="Astellungen">${I.sliders}</button>`;
function setHeader(title, backLabel, endHtml) {
  $("#navTitle").textContent = title;
  const b = $("#backBtn");
  b.innerHTML = I.back; b.classList.toggle("hidden", !backLabel);
  b.setAttribute("aria-label", backLabel ? "Zréck op " + backLabel : "Zréck");
  $("#navEnd").innerHTML = endHtml === undefined ? gearBtn : endHtml;
  const m = $("#menuBtn"); if (m) m.onclick = () => go("#/settings");
  document.title = title === APP_NAME ? title : title + " – " + APP_NAME;
}
function updateNav() {
  const nav = $("#nav"), lt = $("#largeTitle");
  nav.classList.toggle("scrolled", window.scrollY > 4);
  $("#navTitle").classList.toggle("show", !lt || lt.getBoundingClientRect().bottom < nav.offsetHeight + 2);
}
window.addEventListener("scroll", () => requestAnimationFrame(updateNav), { passive: true });
function setView(html, withDock) {
  const v = $("#view"); v.className = withDock ? "with-dock" : "";
  v.innerHTML = html; window.scrollTo(0, 0); updateNav();
}
$("#backBtn").onclick = () => goBack();

/* Zurück: immer eine Ebene höher (die Browser-Zurück-Taste funktioniert über den Hash ebenfalls) */
function parentHash() {
  const p = location.hash.replace(/^#\/?/, "").split("/");
  if (p[0] === "c" && p[1] && p[2]) return "#/c/" + p[1];
  return "#/";
}
function isHome() { const h = location.hash.replace(/^#\/?/, ""); return h === ""; }
function hasUnsavedDraft() {
  const d = $("#draft");
  return !!(rec || (sheetOpen() && d && !txBusy && d.value.trim() !== (sheet.initial || "").trim()));
}
function goBack() {
  if (hasUnsavedDraft() && !confirm("Net gespäichert Notiz verwerfen?")) return;
  if (isHome()) return;
  go(parentHash());
}
/* Tastatur: Return/Leertaste auf Listenzeilen, Escape schließt Sheets */
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('[role="button"]')) { e.preventDefault(); e.target.click(); }
  if (e.key === "Escape") { if ($("#actions")) closeActionSheet(); else if (sheetOpen()) $("#discard").click(); }

/* ---------- Routing ---------- */
function go(hash) { if (location.hash !== hash) location.hash = hash; else render(); }
window.addEventListener("hashchange", render);
function render() {
  stopRecording(true); closeActionSheet(); document.body.classList.remove("sheet-open");
  const parts = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  if (parts[0] === "c" && parts[1] && parts[2] === "edit") return renderEditStudents(parts[1]);

/* Sheet nach unten wischen zum Schließen */
function swipeToDismiss(box, handle, onDismiss) {
  let y0 = null, dy = 0;
  handle.addEventListener("touchstart", e => { y0 = e.touches[0].clientY; dy = 0; }, { passive: true });
  handle.addEventListener("touchmove", e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); box.style.transform = `translateY(${dy}px)`; }, { passive: true });

/* ---------- Aufnahme mit Wellenform ---------- */
function pickMime() {
  const opts = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus", "audio/mp4"];
  return opts.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
}
function setDockRecording(on) {
  const d = $("#dock"), b = $("#recBtn"); if (!d || !b) return;
  d.classList.toggle("recording", on); b.classList.toggle("on", on);
  b.setAttribute("aria-label", on ? "Opnam stoppen" : "Opnam starten");
  const t = $("#timer"); if (t) { t.textContent = "0:00"; t.classList.remove("warn"); }
}
function startWave(ac, stream) {
  const canvas = $("#wave"); if (!ac || !canvas) return;
  try {
    if (ac.state === "suspended") ac.resume().catch(() => {});
    const src = ac.createMediaStreamSource(stream), an = ac.createAnalyser();
    an.fftSize = 1024; src.connect(an);
    const buf = new Uint8Array(an.fftSize), bars = [], dpr = window.devicePixelRatio || 1, BAR = 3, GAP = 3;
    const css = getComputedStyle(document.documentElement);
    let last = 0, raf = 0, alive = true;
    const draw = t => {
      if (!alive) return;
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if (w && canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
      if (t - last > 55) {
        last = t; an.getByteTimeDomainData(buf);
        let sum = 0; for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
        bars.push(Math.min(1, Math.sqrt(sum / buf.length) * 3.4));
        const max = Math.ceil(w / (BAR + GAP)) + 2; if (bars.length > max) bars.splice(0, bars.length - max);
      }
      const g = canvas.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
      g.fillStyle = css.getPropertyValue("--label-2").trim() || "#888";
      const mid = h / 2;
      for (let i = bars.length - 1; i >= 0; i--) {
        const x = w - 12 - (bars.length - 1 - i) * (BAR + GAP) - BAR;
        if (x < -BAR) break;
        const bh = Math.max(BAR, bars[i] * (h - 14));
        g.globalAlpha = Math.max(0, Math.min(1, x / 70));
        g.beginPath(); if (g.roundRect) g.roundRect(x, mid - bh / 2, BAR, bh, BAR / 2); else g.rect(x, mid - bh / 2, BAR, bh); g.fill();
      }
      g.globalAlpha = 1; g.fillStyle = css.getPropertyValue("--red").trim() || "#f33";
      g.beginPath(); if (g.roundRect) g.roundRect(w - 6, 4, 2.5, h - 8, 1.25); else g.rect(w - 6, 4, 2.5, h - 8); g.fill();
      raf = requestAnimationFrame(draw);
    };
    raf = requestAnimationFrame(draw);
    wave = { stop() { alive = false; cancelAnimationFrame(raf); try { src.disconnect(); } catch (e) {} ac.close().catch(() => {}); } };
  } catch (e) { try { ac.close(); } catch (e2) {} wave = null; }
}
function stopWave() { if (wave) { wave.stop(); wave = null; } }

async function startRecording(c, s) {
  if (starting) return;
  if (!navigator.mediaDevices || !window.MediaRecorder) return setHint("Opnam gëtt op dësem Gerät net ënnerstëtzt.", "err");
  // AudioContext sofort (im Tippen-Ereignis) anlegen, sonst startet er auf iOS gesperrt
  const AC = window.AudioContext || window.webkitAudioContext; let ac = null;
  try { ac = AC ? new AC() : null; } catch (e) {}
  let stream; starting = true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) {
    starting = false;
    if (ac) ac.close().catch(() => {});
    return setHint("Kee Zougrëff op de Mikro. Erlaabnes an den Astellunge vum Browser (Site-Astellungen) ginn.", "err");
  }
  const mime = pickMime();
  const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  const chunks = [];
  mr.ondataavailable = e => e.data && e.data.size && chunks.push(e.data);

  mr.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    stopWave();
    const r = rec; rec = null;
    setDockRecording(false);
    if (!r || r.cancelled) { setHint(HINT); return; }
    const type = (mr.mimeType || mime || "audio/webm").split(";")[0];
    const blob = new Blob(chunks, { type });
    if (blob.size < 2000) return setHint("Opnam ze kuerz.", "err");
    lastAudio = { blob, mime: type };
    transcribe(lastAudio, r.c, r.s);
  };
  mr.start(1000);
  clearTimeout(hintTimer);
  setDockRecording(true);
  startWave(ac, stream);
  rec.timer = setInterval(() => {
    const sec = Math.floor((Date.now() - rec.start) / 1000);
    const t = $("#timer"); if (t) { t.textContent = Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); t.classList.toggle("warn", sec >= MAX_REC_SECONDS - 10); }
    if (sec >= MAX_REC_SECONDS) stopRecording(false);
  }, 250);
}
function stopRecording(cancel) {
  if (!rec) return;
  clearInterval(rec.timer);
  rec.cancelled = !!cancel;
  if (rec.mr.state !== "inactive") rec.mr.stop(); else { rec.stream.getTracks().forEach(t => t.stop()); stopWave(); rec = null; }
}

/* ---------- LuxASR ---------- */
function buildPrompt(c, s) {
  // Namen der Klasse als Schreibhilfe (max. 900 Zeichen, Wichtigstes zuerst)
  const names = s.id === "general" ? c.students.map(x => x.name) : [s.name, ...c.students.filter(x => x.id !== s.id).map(x => x.name)];
  let p = "";
  for (const n of names) { if ((p + n + ", ").length > 880) break; p += n + ", "; }
  return p.replace(/, $/, ".");
}
/* Netzwerkfehler vom Browser sind nicht unterscheidbar: "offline" erkennen wir über navigator.onLine,
   alles andere ist Internet-Problem oder eine CORS-Sperre (der Server erlaubt den Zugriff von dieser Seite nicht). */
class NetError extends Error {}
async function http(method, url, opts = {}) {
  let r;
  try { r = await fetch(url, { method, headers: opts.headers, body: opts.blob }); }
  catch (e) {
    throw new NetError(navigator.onLine === false
      ? "Keng Internetverbindung. Verbann dech a probéier nach eng Kéier."
      : "De Server ass vun dësem Browser aus net erreechbar (Internet oder CORS-Spär). Probéier nach eng Kéier. Wann et bleift, kuck an den Astellungen ënner „Sproocherkennung“.");
  }
  const txt = await r.text(); let data = txt;
  try { data = JSON.parse(txt); } catch (e) {}
  return { status: r.status, data };
}
/* Verbindungstest für die Einstellungen: leere Anfrage mit denselben Headern wie eine echte Aufnahme
   (löst denselben CORS-Preflight aus). Jede HTTP-Antwort, auch ein Fehlercode, heißt: erreichbar. Es werden keine Audiodaten gesendet. */
async function testServer() {
  try {
    const r = await http("POST", `${API}/asr2?language=lb&outfmt=text`, { headers: { "Content-Type": "audio/webm", "X-Filename": "test.webm" }, blob: new Blob([]) });
    return { ok: true, status: r.status };
  } catch (e) { return { ok: false, msg: e.message }; }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function transcribe(audio, c, s) {
  const tok = ++txTok;
  const alive = () => tok === txTok && location.hash === `#/c/${c.id}/s/${s.id}`;
  openNoteSheet(c, s, null, { busy: true });
  const rb = $("#recBtn"); if (rb) rb.disabled = true;
  try {
    const ext = audio.mime.includes("mp4") ? "m4a" : audio.mime.includes("ogg") ? "ogg" : "webm";
    const q = new URLSearchParams({ language: "lb", diarization: "Disabled", hesitations: "Hide", outfmt: "text", prompt: buildPrompt(c, s) });
    const headers = { "Content-Type": audio.mime, "X-Filename": "notiz." + ext };
    const sub = await http("POST", `${API}/asr2?${q.toString().replace(/\+/g, "%20")}`, { headers, blob: audio.blob });
    const jobId = sub.data && sub.data.job_id;
    if (!jobId) throw new Error("Äntwert vum Server ouni Job (" + sub.status + ")");
    const t0 = Date.now();
    while (true) {
      await sleep(1200);
      if (!alive()) return;
      if (Date.now() - t0 > 120000) throw new Error("Timeout");
      const st = await http("GET", `${API}/v3/asr/jobs/${jobId}`);
      const status = st.data && st.data.status;
      if (status === "completed") break;
      if (status === "failed") throw new Error("Transkriptioun feelgeschloen");
      if (alive()) setStatus(status === "queued" ? "An der Waardeschlaang…" : "Gëtt transkribéiert…", "", true);
    }
    const res = await http("GET", `${API}/v3/asr/jobs/${jobId}/result`);
    let text = res.data;
    if (text && typeof text === "object") text = text.text || JSON.stringify(text);
    text = String(text || "").trim();
    if (!alive()) return; // Benutzer hat abgebrochen oder den Bildschirm verlassen: nichts automatisch speichern
    setBusy(false);
    $("#draft").value = text; sheet.initial = ""; autosize();
    $("#retry").classList.remove("hidden");
    setStatus("Kontrolléieren a späicheren", "ok");
  } catch (e) {
    if (!alive()) return;
    setBusy(false);
    $("#draft").placeholder = "Transkriptioun feelgeschloen – nach eng Kéier probéieren oder tippen.";
    $("#retry").classList.toggle("hidden", !lastAudio);
    setStatus(e instanceof NetError ? e.message : "Feeler: " + (e.message || e) + ". Probéier nach eng Kéier.", "err");
    $("#draft").focus();
  } finally {
    const b = $("#recBtn"); if (b && tok === txTok) b.disabled = false;
  }
}

/* Gibt true zurück, wenn die Datei geteilt/heruntergeladen wurde, false wenn der Benutzer abgebrochen hat. */
async function shareFile(name, content, mime) {
  // Handy: Teilen-Menü (Mail, Drive, OneDrive, "In Dateien sichern"). Sonst, oder wenn das Teilen nicht klappt: normaler Download.
  try {
    const file = new File([content], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      return true;
    }
  } catch (e) {
    if (e && e.name === "AbortError") return false; // Benutzer hat abgebrochen
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type: mime }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  return true;
}

/* ---------- Cloud-Backup: verschlüsselt (AES-GCM), über den eigenen Cloudflare-Worker ---------- */
const CLOUD_KEY = "klassennotizen.cloud"; // { on, token, pass } nur auf diesem Gerät
let CLOUD_DELAY = 30000;                  // Ruhezeit nach der letzten Änderung (ms)
let cloud = { on: false, token: "", pass: "" };
try { Object.assign(cloud, JSON.parse(localStorage.getItem(CLOUD_KEY))); } catch (e) {}
const saveCloudCfg = () => { try { localStorage.setItem(CLOUD_KEY, JSON.stringify(cloud)); } catch (e) {} };
const cloudReady = () => !!(cloud.on && cloud.token && cloud.pass && API !== DEFAULT_API);
class CloudError extends Error {}
let cloudBusy = false, cloudTimer = 0;

const b64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, salt, iter) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function encryptBackup(text, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 200000;
  const key = await deriveKey(pass, salt, iter);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(text)));
  return JSON.stringify({ v: 1, kdf: "PBKDF2-SHA256", iter, salt: b64(salt), iv: b64(iv), ct: b64(ct) });
}
async function decryptBackup(blob, pass) {
  let o; try { o = JSON.parse(blob); } catch (e) {}
  if (!o || o.v !== 1) throw new CloudError("Dat ass kee gülteg Cloud-Backup.");
  try {
    const key = await deriveKey(pass, unb64(o.salt), o.iter);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(o.iv) }, key, unb64(o.ct)));
  } catch (e) { throw new CloudError("Falscht Passwuert (oder de Backup ass beschiedegt)."); }
}
async function cloudFetch(method, path, body, token) {
  let r;
  try { r = await fetch(API + path, { method, headers: { "X-Backup-Token": token || cloud.token, ...(body ? { "Content-Type": "text/plain" } : {}) }, body }); }
  catch (e) { throw new CloudError(navigator.onLine === false ? "Keng Internetverbindung." : "De Worker ass net erreechbar. Adress ënnen bei „Sproocherkennung“ kontrolléieren."); }
  if (r.status === 401) throw new CloudError("Den Token ass falsch.");
  if (r.status === 501) throw new CloudError("Am Worker feelt nach d’KV-Bindung BACKUPS oder de Secret BACKUP_TOKEN (kuck README).");
  if (!r.ok && r.status !== 404) throw new CloudError("Server-Feeler (" + r.status + "). Ass dee neisten Worker-Code installéiert?");
  return r;
}
function cloudStateText() {
  if (meta.cloudErr) return "Feeler: " + meta.cloudErr;
  if (!meta.cloudAt) return meta.cloudDirty ? "Waart op den éischten Upload" : "Nach net gesécher";
  return (meta.cloudDirty ? "Ännerungen waarden · " : "Alles gesécher · ") + "läschten Upload " + relTime(meta.cloudAt);
}
function cloudLine() {
  if (!cloud.on) return "";
  if (meta.cloudErr) return " · Cloud: ⚠ " + meta.cloudErr;
  if (!meta.cloudAt) return " · Cloud: waart";
  return meta.cloudDirty ? " · Cloud: Ännerungen waarden" : " · Cloud: " + relTime(meta.cloudAt);
}
function refreshCloudLine() {
  const a = $("#cloudLine"); if (a) a.textContent = cloudLine();
  const b = $("#cloudState"); if (b) b.textContent = cloudStateText();
}
function scheduleCloud() { clearTimeout(cloudTimer); cloudTimer = 0; if (cloudReady()) cloudTimer = setTimeout(uploadCloud, CLOUD_DELAY); }
async function uploadCloud() {
  clearTimeout(cloudTimer); cloudTimer = 0;
  if (!cloudReady() || cloudBusy || !meta.cloudDirty) return;
  if (!db.classes.length) return; // nie ein leeres Backup hochladen und ein gutes überschreiben
  cloudBusy = true;
  const snapshot = JSON.stringify(db);
  try {
    await cloudFetch("PUT", "/backup", await encryptBackup(snapshot, cloud.pass));
    meta.cloudAt = Date.now(); meta.cloudErr = "";
    if (JSON.stringify(db) === snapshot) meta.cloudDirty = false; else scheduleCloud(); // währenddessen geändert
  } catch (e) { meta.cloudErr = e instanceof CloudError ? e.message : "Upload feelgeschloen."; }
  cloudBusy = false; saveMeta(); refreshCloudLine();
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") uploadCloud(); });
window.addEventListener("pagehide", () => { uploadCloud(); });
window.addEventListener("online", () => { uploadCloud(); });
if (cloudReady() && meta.cloudDirty) setTimeout(uploadCloud, 3000);

function bindCloudSettings() {
  const res = $("#cloudRes"), say = (m, bad) => { res.textContent = m; res.style.color = bad ? "var(--red)" : ""; };
  const fields = () => ({ token: $("#cloudToken").value.trim(), pass: $("#cloudPass").value, pass2: $("#cloudPass2") ? $("#cloudPass2").value : null });
  const check = f => {
    if (API === DEFAULT_API) return "Fir d’éischt ënnen bei „Sproocherkennung“ d’Adress vum Worker aginn.";
    if (!f.token) return "Den Token feelt.";
    if (f.pass.length < 8) return "D’Passwuert muss mindestens 8 Zeechen hunn.";
    if (f.pass2 !== null && f.pass !== f.pass2) return "D’Passwierder sinn net gläich.";
    return "";
  };
  const fail = e => say(e instanceof CloudError ? e.message : "Feeler: " + (e && e.message || e), true);
  if ($("#cloudOn")) $("#cloudOn").onclick = async () => {
    const f = fields(), bad = check(f); if (bad) return say(bad, true);
    say("Gëtt getest…");
    try {
      const st = await (await cloudFetch("GET", "/backup/status", null, f.token)).json();
      if (st.latest) { // ein vorhandenes Backup muss sich mit diesem Passwort öffnen lassen
        const old = await (await cloudFetch("GET", "/backup", null, f.token)).text();
        try { await decryptBackup(old, f.pass); } catch (e) { throw new CloudError("Et gëtt schonn e Cloud-Backup, dat sech net mat dësem Passwuert opmaache léisst."); }
      }
      Object.assign(cloud, { on: true, token: f.token, pass: f.pass }); saveCloudCfg();
      if (db.classes.length) {
        meta.cloudDirty = true; await uploadCloud();
        if (meta.cloudErr) throw new CloudError(meta.cloudErr);
        const back = await decryptBackup(await (await cloudFetch("GET", "/backup")).text(), cloud.pass); // Gegenprobe
        if (back !== JSON.stringify(db)) throw new CloudError("D’Gegenprobe ass feelgeschloen.");
      }
      toast("Cloud-Backup ass aktiv ✓"); renderSettings();
    } catch (e) { cloud.on = false; saveCloudCfg(); fail(e); }
  };
  if ($("#cloudNow")) $("#cloudNow").onclick = async () => {
    say("Gëtt gesécher…"); meta.cloudDirty = true; await uploadCloud();
    say(meta.cloudErr || "An der Cloud gesécher ✓", !!meta.cloudErr);
  };
  if ($("#cloudOff")) $("#cloudOff").onclick = () => { cloud.on = false; saveCloudCfg(); clearTimeout(cloudTimer); toast("Cloud-Backup ausgeschalt"); renderSettings(); };
  $("#cloudRestore").onclick = async () => {
    const f = fields(); f.pass2 = null; const bad = check(f); if (bad) return say(bad, true);
    say("Gëtt gelueden…");
    try {
      const st = await (await cloudFetch("GET", "/backup/status", null, f.token)).json();
      if (!st.latest) return say("An der Cloud ass nach kee Backup.", true);
      const restore = async day => {
        try {
          const text = await (await cloudFetch("GET", "/backup" + (day ? "?day=" + day : ""), null, f.token)).text();
          const d = JSON.parse(await decryptBackup(text, f.pass));
          if (!d || !Array.isArray(d.classes)) throw new CloudError("Dat ass kee gülteg Backup.");
          if (db.classes.length && !confirm("All aktuell Daten ginn duerch de Cloud-Backup ersat. Weider?")) return say("");
          d.classes.forEach(ensureGeneral); db = d; save();
          clearTimeout(cloudTimer); meta.cloudDirty = false; saveMeta(); // gerade erst von dort geholt: nichts zurückschreiben
          toast("Backup aus der Cloud restauréiert"); go("#/"); render();
        } catch (e) { fail(e); }
      };
      const label = ts => fmtDate(ts) + " " + new Date(ts).toLocaleTimeString(LOC, { hour: "2-digit", minute: "2-digit" });
      actionSheet([
        { label: "Neisten (" + (typeof st.latest === "string" ? label(Date.parse(st.latest)) : "–") + ")", icon: I.restore, run: () => restore("") },
        ...[...st.days].reverse().map(d => ({ label: "Stand vum " + fmtDate(new Date(d + "T12:00:00Z").getTime()), icon: I.restore, run: () => restore(d) }))
      ], { title: "Cloud-Backup restauréieren" });
      say("");
    } catch (e) { fail(e); }
  };
}

render();

  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
